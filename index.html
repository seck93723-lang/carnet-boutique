<style>
/* Layout: carnet de caisse mobile — en-tête collant, contenu en colonne, 5 onglets en bas, fenêtres qui montent du bas */
:root{
  --bg:#F2F4EF; --card:#FFFFFF; --ink:#16231D; --muted:#5E6B64; --line:#DCE2DA;
  --accent:#0B6E5B; --accent-soft:#DDEFE8; --on-accent:#FFFFFF; --debt:#B9741A; --debt-soft:#F7EBD8;
  --danger:#B4382F; --danger-soft:#F7E1DE; --ok:#2E7D4F;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --card:#18221D; --ink:#E8EEEA; --muted:#97A59D; --line:#2A3630;
  --accent:#3FB596; --accent-soft:#163329; --on-accent:#06130E; --debt:#E0A34B; --debt-soft:#33281A;
  --danger:#EE7B70; --danger-soft:#3A1F1C; --ok:#62C08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --card:#18221D; --ink:#E8EEEA; --muted:#97A59D; --line:#2A3630;
  --accent:#3FB596; --accent-soft:#163329; --on-accent:#06130E; --debt:#E0A34B; --debt-soft:#33281A;
  --danger:#EE7B70; --danger-soft:#3A1F1C; --ok:#62C08A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:8px 10px;justify-content:space-between;flex-wrap:wrap}
.brand{flex:1 1 150px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;border:0;cursor:pointer}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--debt-soft);color:var(--debt)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qb{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;overflow-wrap:anywhere;text-align:center}
.qb span{font-weight:600;font-size:12.5px;color:var(--ink)}
.chk{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:600}
.chk input{width:22px;height:22px;flex:none}
.chip.lang{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:18px 0 10px;text-wrap:balance}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .k{font-size:14.5px;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:800;font-size:22px;margin-top:2px;overflow-wrap:anywhere}
.stat.debt .v{color:var(--debt)} .stat.cash .v{color:var(--accent)} .stat.bad .v{color:var(--danger)}
.stat.wide{grid-column:1/-1}
button.stat{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:14px;color:var(--muted)}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.amt.debt{color:var(--debt)} .amt.low{color:var(--danger)} .amt.ok{color:var(--ok)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--danger-soft);color:var(--danger);margin-left:4px;vertical-align:1px}
.tag.w{background:var(--debt-soft);color:var(--debt)} .tag.g{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 14px;color:var(--muted);text-align:center;font-size:15px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%;text-align:center;text-decoration:none;display:block}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:11px 14px;font-size:15px;width:auto;display:inline-block}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 4px;font-size:15px;min-height:46px;font-weight:600;cursor:pointer}
.segb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.li{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px 0;border-top:1px dashed var(--line)}
.li:first-child{border-top:0}
.li-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.li-name small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.li-ctrl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--accent-soft);color:var(--accent);width:46px;height:46px;font-size:20px;font-weight:700;cursor:pointer}
.step input{border:0;border-radius:0;width:56px;text-align:center;padding:10px 4px;background:var(--card)}
.li-amt{font-weight:700;white-space:nowrap}
.x{border:0;background:var(--danger-soft);color:var(--danger);width:42px;height:42px;font-size:20px;border-radius:8px;font-weight:700;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:2px solid var(--ink);margin-top:6px}
.total b{font-family:var(--display);font-size:26px;font-weight:800}
.results{display:flex;flex-direction:column;gap:6px}
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.res .s{font-size:14px;color:var(--muted)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px}
.mi svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mi b{font-size:16px}
.mi span{font-size:14px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{background:none;border:0;padding:10px 2px 11px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-inline:16px;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:21px;min-width:0;overflow-wrap:anywhere}
.receipt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;line-height:1.5;overflow-x:auto}
.banner{border-radius:12px;padding:12px 14px;font-size:14.5px;margin-top:4px;display:flex;flex-direction:column;gap:8px}
.banner.warn{background:var(--debt-soft);color:var(--debt)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.idbox{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.18em;text-align:center;padding:10px;background:var(--accent-soft);color:var(--accent);border-radius:12px}
#reader{width:100%;min-height:230px;border-radius:12px;overflow:hidden;background:#000}
#reader video{width:100%!important;height:auto!important;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:600;font-size:15.5px;z-index:40;max-width:90%;text-align:center}
.hero-on{padding-block:28px 10px}
.hero-on h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.hero-on p{color:var(--muted);margin:0 0 18px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{white-space:nowrap}
.small{font-size:14px;color:var(--muted)}
html.big body{zoom:1.15}
@supports not (zoom:1){html.big body{font-size:18px}}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;cursor:pointer;font-size:16px;margin-top:14px}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

function renderResults(){const box=$('pResults');if(!box||!draft)return;const q=draft.q.trim().toLowerCase();

const priceOf=p=>draft&&draft.gros&&p.priceGros>0?p.priceGros:p.price;
function addProdToDraft(p){const ex=draft.lines.find(l=>l.pid===p.id);if(ex)ex.qty=q2(ex.qty+1);else draft.lines.push({pid:p.id,name:p.name,unit:p.unit,qty:1,price:priceOf(p)});
  if(expState(p)==='out')toast('Attention : '+p.name+' est périmé');else if(p.qty-(ex?ex.qty:1)<0)toast('Attention : stock de '+p.name+' insuffisant');}
function readDraft(){if(!draft)return;const m={dClient:'client',dPhone:'phone',dPaid:'paid',dDue:'due',fName:'fName',fQty:'fQty',fPrice:'fPrice',pSearch:'q'};
  Object.keys(m).forEach(k=>{const e=$(k);if(e)draft[m[k]]=e.value;});
  document.querySelectorAll('.li-qty').forEach(e=>{const l=draft.lines[+e.dataset.i];if(l)l.qty=num(e.value);});
  document.querySelectorAll('.li-price').forEach(e=>{const l=draft.lines[+e.dataset.i];if(l)l.price=num(e.value);});}
function calc(){const total=draft.lines.reduce((a,l)=>a+l.qty*l.price,0);const g=String(draft.paid).trim();const given=g===''?(draft.mode==='Crédit'?0:total):num(g);
  return{total,given,paid:Math.min(Math.max(0,given),total),change:Math.max(0,given-total),missing:Math.max(0,total-given)};}
function changeHTML(){if(!draft||!draft.lines.length)return '';const c=calc();
  if(c.change>0)return '<div class="banner" style="background:var(--accent-soft);color:var(--accent)"><span>Rendre au client</span><b style="font-family:var(--display);font-size:30px">'+F(c.change)+'</b><span class="small" style="color:inherit">Reçu '+F(c.given)+' pour '+F(c.total)+'</span></div>';
  if(c.missing>0)return '<div class="banner warn"><span>Il manque</span><b style="font-family:var(--display);font-size:30px">'+F(c.missing)+'</b><span class="small" style="color:inherit">'+(c.given>0?'Reçu '+F(c.given)+'. ':'')+'Le reste ira dans les crédits du client : écrivez son nom.</span></div>';
  return '<div class="banner" style="background:var(--accent-soft);color:var(--accent)"><b>Montant exact : rien à rendre</b></div>';}
function updChange(){const b=$('changeBox');if(b)b.innerHTML=changeHTML();}
function updTotals(){if(!draft)return;draft.lines.forEach((l,i)=>{const e=$('la'+i);if(e)e.textContent=F(l.qty*l.price);});const t=$('saleTotal');if(t)t.textContent=F(draft.lines.reduce((a,l)=>a+l.qty*l.price,0));updChange();}

function vDebt(){const all=S.clients.map(c=>({c,b:balance(c.id)}));const owe=all.filter(x=>x.b>0).sort((a,b)=>(isLate(b.c)-isLate(a.c))||b.b-a.b);

function vReport(){const t=effToday();const from=period==='day'?t:period==='week'?addDays(t,-6):t.slice(0,8)+'01';const inP=d=>d.slice(0,10)>=from;
  const sales=S.sales.filter(s=>inP(s.date)),pays=S.payments.filter(p=>inP(p.date)),exps=S.expenses.filter(e=>inP(e.date));
  const ventes=sales.reduce((a,s)=>a+s.total,0),credit=sales.reduce((a,s)=>a+s.total-s.paid,0);
  let marge=0,miss=0;const top={};sales.forEach(s=>s.lines.forEach(l=>{if(l.cost>0)marge+=(l.price-l.cost)*l.qty;else miss++;const k=l.name;top[k]=top[k]||{q:0,a:0,u:l.unit||''};top[k].q+=l.qty;top[k].a+=l.qty*l.price;}));
  const dep=exps.reduce((a,e)=>a+e.amount,0);
  const byMode={};MODES.forEach(m=>byMode[m]=0);sales.forEach(s=>{if(s.paid>0)byMode[MODES.includes(s.mode)?s.mode:'Espèces']+=s.paid;});pays.forEach(p=>byMode[p.mode]=(byMode[p.mode]||0)+p.amount);
  const enc=Object.values(byMode).reduce((a,b)=>a+b,0);
  const cashOut=exps.filter(e=>e.mode==='Espèces').reduce((a,e)=>a+e.amount,0)+S.purchases.filter(p=>inP(p.date)&&p.mode==='Espèces').reduce((a,p)=>a+p.paid,0)+S.supPayments.filter(p=>inP(p.date)&&p.mode==='Espèces').reduce((a,p)=>a+p.amount,0);
  const topL=Object.entries(top).sort((a,b)=>b[1].a-a[1].a).slice(0,5);
  return '<button class="back" data-tab="more">‹ Plus</button><h2>Bilan</h2><div class="seg" style="margin-bottom:12px">'+[['day','Aujourd\'hui'],['week','7 jours'],['month','Ce mois']].map(([k,l])=>'<button class="segb" data-act="period" data-p="'+k+'" aria-pressed="'+(period===k)+'">'+l+'</button>').join('')+'</div>'+
  '<div class="stats"><div class="stat"><div class="k">Ventes</div><div class="v">'+F(ventes)+'</div><div class="small">'+sales.length+' facture(s)</div></div><div class="stat cash"><div class="k">Encaissé</div><div class="v">'+F(enc)+'</div></div>'+

      {id:uid(),no:3,date:t+'T11:05',client:c2.name,clientId:c2.id,lines:[{...pl('Lait en poudre 400 g'),qty:2,price:2250},{...pl('Huile Dinor 1 L'),qty:4,price:1300}],total:9700,paid:5000,mode:'Orange Money',due:c2.due}];

function restore(txt){try{const o=JSON.parse(txt);if(!o||!o.lic||!o.shop||!Array.isArray(o.sales))throw 0;S=migrate(o);S.lic.maxSeen=S.lic.maxSeen||todayISO();save();closeSheet();tab='home';render();toast('Sauvegarde restaurée');}catch(e){toast('Ce fichier n\'est pas une sauvegarde Carnet Boutique');}}

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab);return;}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  const A={
  closeBg:()=>{if(e.target===el)closeSheet();},close:closeSheet,
  demo:()=>start({name:'Boutique Exemple',owner:'Moustapha',phone:'77 000 00 00',address:'Touba'},true),

  showSale:()=>showDoc('s',S.sales.find(s=>s.id===id)),showQuote:()=>showDoc('q',S.quotes.find(s=>s.id===id)),

  mode:()=>{readDraft();draft.mode=el.dataset.m;if(draft.mode==='Crédit')draft.paid='0';else if(draft.paid==='0')draft.paid='';render();},
  addProd:()=>{readDraft();addProdToDraft(prod(id));draft.q='';render();},
  give:()=>{readDraft();const v=el.dataset.v,c=calc();if(v==='exact')draft.paid=String(Math.round(c.total));else if(v==='0')draft.paid='';else draft.paid=String((String(draft.paid).trim()===''?0:num(draft.paid))+num(v));if(draft.mode==='Crédit'&&num(draft.paid)>0)draft.mode='Espèces';const e=$('dPaid');if(e)e.value=draft.paid;updChange();},
  showFree:()=>{readDraft();draft.free=true;render();},
  addFree:()=>{readDraft();const n=draft.fName.trim(),q=num(draft.fQty),p=num(draft.fPrice);if(!n)return toast('Écrivez le nom');if(q<=0||p<=0)return toast('Quantité et prix obligatoires');draft.lines.push({pid:null,name:n,unit:'pièce',qty:q,price:p});Object.assign(draft,{free:false,fName:'',fQty:'1',fPrice:''});render();},
  qm:()=>{readDraft();const l=draft.lines[+el.dataset.i];l.qty=q2(Math.max(0,l.qty-1));if(l.qty===0)draft.lines.splice(+el.dataset.i,1);render();},
  qp:()=>{readDraft();const l=draft.lines[+el.dataset.i];l.qty=q2(l.qty+1);render();},
  delLine:()=>{readDraft();draft.lines.splice(+el.dataset.i,1);render();},
  clearDraft:()=>{draft=newDraft();render();},
  saveSale:()=>{readDraft();if(!w())return;const d=draft;d.lines=d.lines.filter(l=>l.qty>0);if(!d.lines.length)return toast('Panier vide');
    const cc=calc(),total=cc.total,paid=cc.paid;
    const c=d.client.trim()?findOrCreateClient(d.client,d.phone):null;if(paid<total&&!c)return toast('Écrivez le nom du client pour le crédit');

    d.lines.forEach(l=>{if(l.pid){const p=prod(l.pid);if(p){p.qty=q2(p.qty-l.qty);l.cost=p.cost||0;}}});
    S.seq.sale++;const s={id:uid(),no:S.seq.sale,date:nowStamp(),client:c?c.name:'',clientId:c?c.id:null,phone:d.phone.trim(),lines:d.lines.map(l=>({pid:l.pid,name:l.name,unit:l.unit,qty:l.qty,price:l.price,cost:l.cost||0})),total,paid,given:cc.given,change:cc.change,mode:paid===0?'Crédit':d.mode==='Crédit'?'Espèces':d.mode,due:paid<total?d.due:''};
    if(d.fromQuote){const q=S.quotes.find(x=>x.id===d.fromQuote);if(q)q.status='vendu';}
    S.sales.push(s);save();draft=null;tab='home';render();showDoc('s',s);},
  saveQuote:()=>{readDraft();if(!w())return;const d=draft;d.lines=d.lines.filter(l=>l.qty>0);if(!d.lines.length)return toast('Panier vide');
    S.seq.quote++;const q={id:uid(),no:S.seq.quote,date:nowStamp(),client:d.client.trim(),phone:d.phone.trim(),lines:d.lines.map(l=>({...l})),total:d.lines.reduce((s,l)=>s+l.qty*l.price,0),status:'ouvert'};
    S.quotes.push(q);save();draft=null;tab='quotes';render();showDoc('q',q);},
  quoteToSale:()=>{if(!w())return;const q=S.quotes.find(x=>x.id===id);draft=newDraft();Object.assign(draft,{lines:q.lines.map(l=>({...l})),client:q.client,phone:q.phone,fromQuote:q.id});tab='sell';closeSheet();render();scrollTo(0,0);toast('Vérifiez les prix et le stock, puis enregistrez');},
  askDelQ:()=>{$('delZone').innerHTML='<div class="banner bad"><span>Supprimer ce devis ?</span><div class="grid2"><button class="btn danger" data-act="delQ" data-id="'+id+'">Oui</button><button class="btn line" data-act="close">Non</button></div></div>';},
  delQ:()=>{S.quotes=S.quotes.filter(q=>q.id!==id);save();closeSheet();render();},
  askCancel:()=>needPin(()=>{const s=S.sales.find(x=>x.id===id);showDoc('s',s);$('delZone').innerHTML='<div class="banner bad"><span>Annuler la facture N° '+no4(s.no)+' ? Les articles reviennent dans le stock.</span><div class="grid2"><button class="btn danger" data-act="cancelSale" data-id="'+id+'">Oui, annuler</button><button class="btn line" data-act="close">Non</button></div></div>';}),
  cancelSale:()=>{const s=S.sales.find(x=>x.id===id);s.lines.forEach(l=>{const p=l.pid&&prod(l.pid);if(p)p.qty=q2(p.qty+l.qty);});S.sales=S.sales.filter(x=>x.id!==id);save();closeSheet();render();toast('Facture annulée');},
  pay:()=>{if(!w())return;const amt=num(val('pAmt'));if(amt<=0)return toast('Montant invalide');S.payments.push({id:uid(),clientId:id,date:nowStamp(),amount:amt,mode:val('pMode')});const c=client(id);if(balance(id)<=0)c.due='';save();render();showClient(id);toast('Paiement de '+F(amt)+' enregistré');},
  cSave:()=>{const c=client(id);c.phone=val('cPhone').trim();c.due=val('cDue');save();render();showClient(id);toast('Enregistré');},
  saveOld:()=>{if(!w())return;const n=val('oName').trim();if(!n)return toast('Écrivez le nom');const c=findOrCreateClient(n,val('oPhone'));c.opening=(c.opening||0)+num(val('oAmt'));if(val('oDue'))c.due=val('oDue');save();closeSheet();render();toast('Client enregistré');},
  saveProd:()=>{if(!w())return;const f=readProdForm();if(!f.name.trim())return toast('Écrivez le nom');if(num(f.price)<=0)return toast('Mettez le prix de vente');
    if(f.code&&S.products.some(p=>p.code===f.code&&p.id!==id))return toast('Ce code-barres est déjà sur un autre article');
    const v={name:f.name.trim(),code:f.code,unit:f.unit,cost:num(f.cost),price:num(f.price),priceGros:num(f.priceGros),qty:num(f.qty),min:num(f.min),exp:f.exp||'',pack:Math.max(0,Math.round(num(f.pack))),fav:!!f.fav};
    if(id)Object.assign(prod(id),v);else S.products.push({id:uid(),added:todayISO(),...v});save();closeSheet();render();toast('Article enregistré');},
  stockIn:()=>{if(!w())return;const pp=prod(id);const q=num(val('prIn'))+num(val('prInPk'))*((pp&&pp.pack)||0);if(q<=0)return toast('Quantité invalide');const p=prod(id);p.qty=q2(p.qty+q);save();closeSheet();render();toast('+'+q+' '+p.name);},
  askDel:()=>{$('delZone').innerHTML='<div class="banner bad"><span>Supprimer cet article ?</span><div class="grid2"><button class="btn danger" data-act="del" data-id="'+id+'">Oui, supprimer</button><button class="btn line" data-act="close">Non</button></div></div>';},
  del:()=>{S.products=S.products.filter(x=>x.id!==id);save();closeSheet();render();},
  newSup:()=>openSheet('Nouveau fournisseur','<div class="card stack"><label class="f">Nom<input id="nsName" placeholder="Ex : Grossiste Sandaga"></label><div class="grid2"><label class="f">Téléphone<input id="nsPhone" inputmode="tel"></label><label class="f">Je lui dois déjà (F)<input id="nsOpen" inputmode="numeric" placeholder="0"></label></div><button class="btn" data-act="saveSup">Enregistrer</button></div>'),
  saveSup:()=>{const n=val('nsName').trim();if(!n)return toast('Écrivez le nom');S.suppliers.push({id:uid(),name:n,phone:val('nsPhone').trim(),opening:num(val('nsOpen'))});save();closeSheet();render();},
  sup:()=>showSup(id),
  newPurch:()=>{if(!w())return;pdraft={sid:id,lines:[]};showPurchase();},
  puAdd:()=>{const p=prod(val('puPick'));if(!p)return toast('Choisissez un article');const pk=num(val('puPk'));if(pk>0&&!(p.pack>0))return toast('Mettez d\'abord le nombre de pièces par paquet dans Stock');const q=pk>0?pk*p.pack:num(val('puQty')),c=pk>0&&num(val('puPkCost'))>0?num(val('puPkCost'))/p.pack:(num(val('puCost'))||p.cost);if(q<=0)return toast('Quantité invalide');if(c<=0)return toast('Mettez le prix d\'achat');pdraft.lines.push({pid:p.id,name:p.name,qty:q,cost:c});showPurchase();},

  supPay:()=>{if(!w())return;const amt=num(val('spAmt'));if(amt<=0)return toast('Montant invalide');S.supPayments.push({id:uid(),supplierId:id,date:nowStamp(),amount:amt,mode:val('spMode')});save();render();showSup(id);toast('Paiement enregistré');},
  saveExp:()=>{if(!w())return;const amt=num(val('eAmt'));if(amt<=0)return toast('Mettez le montant');S.expenses.push({id:uid(),date:nowStamp(),cat:val('eCat'),amount:amt,note:val('eNote').trim(),mode:val('eMode')});save();render();toast('Dépense enregistrée');},
  period:()=>{period=el.dataset.p;render();},

document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='pSearch'&&draft){draft.q=t.value;renderResults();}
  else if(t.id==='dPaid'&&draft){draft.paid=t.value;updChange();}
  else if(t.id==='stockQ'){stockQ=t.value;const pos=t.selectionStart;render();const n=$('stockQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  else if((t.classList.contains('li-qty')||t.classList.contains('li-price'))&&draft){const l=draft.lines[+t.dataset.i];if(l){l[t.classList.contains('li-qty')?'qty':'price']=num(t.value);updTotals();}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  if(t.id==='pSearch'&&draft){e.preventDefault();const q=t.value.trim();const p=byCode(q)||S.products.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(q&&p){readDraft();addProdToDraft(p);draft.q='';render();const s=$('pSearch');if(s)s.focus();}}
  if(t.id==='scanManual'){e.preventDefault();if(t.value.trim())gotCode(t.value.trim());}
  if(t.id==='pinIn'){e.preventDefault();document.querySelector('[data-act="pinOk"]').click();}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-big')){document.documentElement.classList.toggle('big',t.checked);try{localStorage.setItem('carnetBoutique.big',t.checked?'1':'0');}catch(x){}}
  if(t.id==='scanFile'&&t.files[0])scanImage(t.files[0]);
  if(t.id==='puPick'){const p=prod(t.value);const c=$('puCost');if(p&&c)c.value=p.cost||'';}
  if(t.id==='bkFile'||t.id==='onFile'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f);}});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='fOn'){if(!val('onName').trim())return toast('Écrivez le nom de la boutique');start({name:val('onName').trim(),owner:val('onOwner').trim(),phone:val('onPhone').trim(),address:val('onAddr').trim(),footer:''},false);}
  if(e.target.id==='fShop'){Object.assign(S.shop,{name:val('sName').trim()||S.shop.name,owner:val('sOwner').trim(),phone:val('sPhone').trim(),address:val('sAddr').trim(),footer:val('sFoot').trim()});save();render();toast('Boutique enregistrée');}});
S=load();render();
